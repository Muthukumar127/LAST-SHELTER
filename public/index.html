<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Last Shelter</title>

<style>
:root{--sand:#f6c667;--ink:#3b1f0e;--red:#e4572e;--teal:#17a398}
*{box-sizing:border-box;touch-action:none;user-select:none}
body{margin:0;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:#f3b562}
canvas{display:block}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
 background:linear-gradient(#ffd98a,#f08a4b);z-index:5;text-align:center;padding:16px}
.panel h1{font-size:clamp(40px,9vw,84px);margin:0;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke;transform:rotate(-2deg)}
button,input{font:700 20px Fredoka,sans-serif;border:4px solid var(--ink);border-radius:16px;padding:10px 20px;color:var(--ink)}
button{background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.alt{background:var(--red)}input{background:#fff;text-align:center;width:190px;text-transform:uppercase}
#name{text-transform:none}
#slots{display:grid;grid-template-columns:repeat(2,150px);gap:10px}
.slot{border:4px solid var(--ink);border-radius:16px;background:#fff8;padding:10px;font-weight:700;min-height:48px}
#hud{position:fixed;top:8px;left:8px;right:8px;z-index:3;display:none;pointer-events:none;font-weight:700;text-shadow:0 2px 0 #fff8}
#hud .box{background:#fffc;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;display:inline-block;margin:2px}
#msg{position:fixed;bottom:34%;width:100%;text-align:center;z-index:3;font-size:22px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;pointer-events:none}
#prompt{position:fixed;bottom:22%;width:100%;text-align:center;z-index:3;font-size:20px;pointer-events:none}
#storm{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(transparent 30%,#c9893b);opacity:0}
#mob{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
#mob button{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;padding:0;font-size:15px}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff6;border:4px solid var(--ink);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:var(--red);border:4px solid var(--ink)}
</style></head><body>
<div id="storm"></div><div id="hud"></div><div id="msg"></div><div id="prompt"></div>
<div id="mob"><div id="joy"><div id="knob"></div></div>
<button id="bAct" style="right:24px;bottom:110px">Use</button><button id="bRun" class="alt" style="right:100px;bottom:40px">Run</button>
<button id="bJump" style="right:24px;bottom:30px">Jump</button></div>

box(.4,4.5,16,-10,2.25,0,wallM(16,4.5)); box(.4,4.5,16,10,2.25,0,wallM(16,4.5));

scene.add(house);
// cacti + road
const cactusM=mat(0x3e9b4f);for(let i=0;i<16;i++){const g=new THREE.Group(),h=1.5+Math.random()*1.5;const t=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,h,8),cactusM);t.position.y=h/2;const a=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.9,8),cactusM);a.position.set(.5,h*.6,0);a.rotation.z=.9;g.add(t,a);const an=Math.random()*6.28,r=20+Math.random()*70;g.position.set(Math.cos(an)*r,0,Math.sin(an)*r);scene.add(g);}

add(B(2,.9,2.3,0x2f6fdb),-2,1.5,0);[-1.15,1.15].forEach(z=>add(B(2,.5,.1,0x1f4fa8),-2,2.1,z));add(B(.3,.3,2.4,0xcccccc),2.7,1.1,0);add(B(.3,.3,2.4,0xcccccc),-2.7,1.1,0);

// ---------- game state ----------
const items = {}, labels = {};

  for (const id in s.p) { if (id === myId) continue;

    G.target[id] = s.p[id]; } });

// ---------- audio (procedural Web Audio) ----------

// ---------- main loop ----------
let last = performance.now(), sendT = 0; const _v = new THREE.Vector3();
function loop(now) { requestAnimationFrame(loop); const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && phase === 'play') {
    const m = G.me; G.t += dt;
    let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joy.x, iz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0) + joy.y; const l = Math.hypot(ix, iz);
    const moving = l > .1, sprint = keys.ShiftLeft || run; if (l > 1) { ix /= l; iz /= l; }
    const stormSlow = 1 - G.storm * .35, spd = (sprint ? 9 : 5) * stormSlow;
    if (moving) { const s = Math.sin(yaw), c = Math.cos(yaw); const wx = ix * c + iz * s, wz = -ix * s + iz * c;
      m.x = Math.max(-90, Math.min(90, m.x + wx * spd * dt)); m.z = Math.max(-90, Math.min(90, m.z + wz * spd * dt)); m.ry = Math.atan2(wx, wz); }
    m.vy -= 20 * dt; m.y = Math.max(0, m.y + m.vy * dt); if (m.y === 0) m.vy = 0;
    G.a = !moving ? 'idle' : sprint ? 'run' : 'walk';
    if (!G.avatars[myId]) { G.avatars[myId] = makeChar(COLORS[G.colors[myId] ?? 0]); scene.add(G.avatars[myId]); }
    const me = G.avatars[myId]; me.position.set(m.x, m.y, m.z); me.rotation.y = m.ry; animate(me, G.a, G.t);
    sendT += dt; if (sendT > .066) { sendT = 0; socket.emit('move', { x: m.x, z: m.z, ry: m.ry, a: G.a }); }
    for (const id in G.target) { const av = G.avatars[id], t = G.target[id]; if (!av) continue; // interpolation
      av.position.x += (t[0] - av.position.x) * Math.min(1, dt * 10); av.position.z += (t[1] - av.position.z) * Math.min(1, dt * 10);
      let dr = t[2] - av.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); av.rotation.y += dr * Math.min(1, dt * 10); animate(av, t[3], G.t); }
    for (const id in items) { const it = items[id], tk = G.taken.includes(+id); it.m.visible = !tk; it.m.rotation.y += dt * 2; it.m.position.y = 1.2 + Math.sin(G.t * 3 + +id) * .25; }
    updateTruck(G.step);tp.hood.rotation.z+=((G.step>=6?0:.9)-tp.hood.rotation.z)*Math.min(1,dt*4);
    // storm: sky, fog, particles, wind, overlay
    const s = G.storm; scene.background.copy(clearSky).lerp(stormSky, s); scene.fog.color.copy(scene.background); scene.fog.density = .004 + s * s * .05;
    sand.material.opacity = Math.min(.9, s * 1.2); const a = pg.attributes.position.array;
    for (let i = 0; i < N; i++) { a[i * 3] -= (8 + s * 40) * dt; a[i * 3 + 1] += Math.sin(G.t + i) * dt; if (a[i * 3] < -30) a[i * 3] = 30; }
    pg.attributes.position.needsUpdate = true; sand.position.set(m.x, m.y + 8, m.z); $('storm').style.opacity = s * .55;
    // camera
    const cd = 9; cam.position.set(m.x + Math.sin(yaw) * Math.cos(pitch) * cd, 2 + Math.sin(pitch) * cd, m.z + Math.cos(yaw) * Math.cos(pitch) * cd); {const sh=G.storm*.15;cam.position.x+=(Math.random()-.5)*sh;cam.position.y+=(Math.random()-.5)*sh;}cam.lookAt(m.x, 1.6, m.z);
    // HUD
    const left = Math.max(0, Math.round((1 - s) * G.stormMs / 1000)), n = G.taken.length, np = Object.keys(G.avatars).length;
    const mission = G.step >= 6 ? (G.boarded < np ? 'Everyone get in the truck! (E near truck)' : 'Escaping…') : n < 6 ? 'Find truck parts' : STEP_TXT[G.step] + ' (E at truck)';
    $('hud').innerHTML = `<span class="box">🎯 ${mission}</span><span class="box">🔧 ${n}/6 parts · repair ${G.step}/6</span><span class="box">🌪 Storm in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span><span class="box">👥 ${np} · 🚚 ${G.boarded} aboard</span><br>` +
      '<span class="box" style="font-size:14px">' + PARTS.map(p => (items.length, G.taken.includes(PARTS.indexOf(p)) ? '✅' : '⬜') + LABEL[p]).join(' ') + '</span>';
    const ni = nearestItem(); $('prompt').textContent = ni !== null ? `[E] Pick up ${LABEL[items[ni].type]}` : dist(m, G.truck) < 8 ? (G.step < 6 ? `[E] Repair: ${STEP_TXT[G.step]}` : '[E] Get in the truck') : '';
  } else { cam.position.set(Math.sin(now / 4000) * 25, 10, Math.cos(now / 4000) * 25); cam.lookAt(0, 2, 0); }
  renderer.render(scene, cam); }
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
requestAnimationFrame(loop);
</script></body></html>
